name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build
        env:
          PAX_API_URL: ${{ vars.PAX_API_URL }}
          PAX_AUTH_REALM_URL: ${{ vars.PAX_AUTH_REALM_URL }}
        run: |
          ./gradlew build
